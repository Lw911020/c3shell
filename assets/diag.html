<!DOCTYPE html>
<html lang="zh" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__ · DSH C3 控制台</title>
<style>
:root{
  --bg:#0f1115; --bg2:#161a21; --bg3:#1d222b; --card:#161a21; --line:#2a3140;
  --fg:#e6edf3; --dim:#9aa4b2; --acc:#4b8cf7;
  --y:#e8c400; --g:#3fb950; --o:#ff9f43; --r:#f85149; --b:#4b8cf7;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font:14px/1.5 -apple-system,system-ui,"Segoe UI",Roboto,"PingFang SC","Noto Sans CJK SC",sans-serif;
  -webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:9;background:linear-gradient(180deg,#131820,#10141a);
  border-bottom:1px solid var(--line);padding:8px 10px}
.row1{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
header b.brand{color:var(--fg);font-weight:650;letter-spacing:.2px}
.sp{flex:1}
.pill{padding:3px 10px;border-radius:999px;background:var(--bg3);border:1px solid var(--line);
  font-size:12.5px;color:var(--dim);white-space:nowrap}
.pill.on{color:#0b0f14;background:var(--g);border-color:var(--g);font-weight:600}
button,input,select,textarea{background:var(--bg3);color:var(--fg);border:1px solid var(--line);
  border-radius:9px;padding:6px 11px;font:inherit;outline:none}
button{cursor:pointer}
button:active{transform:translateY(1px)}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
button.dg{background:#7d2020;border-color:#a03030}
button.gh{background:transparent;color:var(--dim)}
button.gh:hover{color:var(--fg);border-color:var(--acc)}
a{color:var(--acc);text-decoration:none}
#st{font-size:12.5px}
#st.pill{color:var(--dim)}
#st.pill.on{color:#0b0f14;background:var(--g);border-color:var(--g);font-weight:600}
.tabs{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
/* 2026-09-24 R104（用户反馈：平板手机模式下菜单没改）：「参数」已提升为一级菜单（原生顶栏「参数设置」✓）→ 手机/平板模式下二级页签里不再重复显示 ✓
   车机模式由侧边栏的过滤逻辑处理 ✓ */
html[data-layout="tablet"] .tab[data-p="p3"],html[data-layout="phone"] .tab[data-p="p3"]{display:none !important}
.tab{padding:7px 14px;border-radius:9px 9px 0 0;background:transparent;border:1px solid transparent;
  border-bottom:none;cursor:pointer;color:var(--dim);font-size:13.5px}
.tab:hover{color:var(--fg)}
.tab.on{background:var(--bg);color:var(--fg);border-color:var(--line);font-weight:600;
  box-shadow:inset 0 2px 0 var(--acc)}
.pane{display:none;padding:12px}
.pane.on{display:block;animation:c3PaneIn .2s cubic-bezier(.25,.8,.3,1) both}   /* 2026-10-05：页内切页签也要柔和，别瞬切 ✓ */
.wrap{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}   /* 2026-10-04 用户要求：默认两列（两张卡片宽）*/
.wrap>.card:only-child{grid-column:1/-1}   /* 2026-10-05 用户要求：只剩一张卡片时，它要占满整行（两卡宽）✓ */
@media(max-width:900px){.wrap{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;
  box-shadow:0 1px 2px rgba(0,0,0,.25)}
.card h4{margin:0 0 8px;font-size:13.5px;font-weight:600;color:#d7dee8;letter-spacing:.2px}
.card h4 span{color:var(--dim);font-weight:400;font-size:12.5px}
  /* 2026-10-04 用户要求：点卡片 → 放大占满其它卡片的位置；再点一次收起 ✓ */
  .card{cursor:zoom-in}
  .card.solo{grid-column:1/-1;order:-1;cursor:zoom-out}
  .card.solo canvas{height:68vh !important;max-height:620px !important}   /* 2026-10-05 修：min() 车机 Chromium74 不支持 → 整条被丢弃，放大后画布还是 110px，铺不满 ✗ */
  .card.solo h4::after{content:"　（再点一次收起）";font-size:12px;font-weight:400;color:var(--dim)}
  body.c3solo .wrap .card:not(.solo){display:none}
  body.c3solo .wrap{grid-template-columns:1fr !important}
  body.c3solo .card.solo{width:100%;max-width:none;box-sizing:border-box}
  body.c3solo .card.solo canvas{width:100% !important}
canvas{width:100%;height:180px;display:block;background:#0b0f14;border-radius:9px;border:1px solid #1b2129}
.vals{display:flex;gap:8px;margin-top:8px;font-size:13.5px;font-variant-numeric:tabular-nums;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;
  background:var(--bg3);border:1px solid var(--line);cursor:pointer;user-select:none;line-height:1.45}
.chip .sw{width:9px;height:9px;border-radius:3px;background:currentColor;display:inline-block}
.chip .nm{font-style:normal;color:var(--dim);font-size:12.5px}
.chip b{font-weight:600;color:var(--fg)}
.chip.off{opacity:.35;text-decoration:line-through}
.chip.y{color:var(--y)} .chip.g{color:var(--g)} .chip.o{color:var(--o)}
.y{color:var(--y)} .g{color:var(--g)} .o{color:var(--o)} .rd{color:var(--r)} .bl{color:var(--b)}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{border-top:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:middle}
th{color:var(--dim);font-weight:500}
tr:hover{background:#1b2129}
.mrow{display:flex;gap:10px;flex-wrap:wrap}
.mbox{flex:1;min-width:170px;background:#0b0f14;border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.mbox .k{color:var(--dim);font-size:12px}
.mbox .v{font-size:20px;font-variant-numeric:tabular-nums;font-weight:600;line-height:1.35}
.ok{color:var(--g)} .warn{color:var(--y)} .bad{color:var(--r)} .na{color:var(--dim)}
pre{background:#0b0f14;border:1px solid var(--line);border-radius:9px;padding:10px;max-height:240px;
  overflow:auto;color:var(--dim);font-size:12.5px;margin:8px 0 0;white-space:pre-wrap}
.prow{display:flex;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.prow .nm{width:230px;color:#d7dee8;word-break:break-all}
.prow .ds{flex:1;color:var(--dim);font-size:12px;min-width:150px}
.prow input{width:92px}
.cur{display:flex;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.cur .nm{width:230px;word-break:break-all}
.cur .vv{color:var(--o);font-variant-numeric:tabular-nums}
label{color:var(--dim);font-size:12.5px}
/* 页面内确认弹窗（2026-09-20）：APP 的 WebView 默认不实现 confirm()，原生弹窗会被静默取消 */
#askMask{position:fixed;inset:0;background:rgba(0,0,0,.62);display:none;align-items:center;justify-content:center;z-index:99;padding:12px}
#askMask.on{display:flex}
#askBox{background:var(--card);border:1px solid var(--line);border-radius:12px;max-width:640px;width:min(640px,96vw);
  box-shadow:0 16px 48px rgba(0,0,0,.5);overflow:hidden}
#askMsg{padding:14px 16px;white-space:pre-wrap;font-size:13.5px;line-height:1.6;max-height:56dvh;overflow:auto}
#askBtns{display:flex;gap:8px;justify-content:flex-end;padding:10px 14px;border-top:1px solid var(--line)}
#askBtns button{min-width:84px}

/* ── 参数表（2026-09-20 用户反馈：没有标题行、备注被挤成 3 行）── */
.phead{display:grid;gap:6px 8px;grid-template-columns:150px 1fr 104px 44px 74px;
  position:sticky;top:0;z-index:3;background:#131820;border-bottom:1px solid var(--line);
  padding:7px 0 6px;color:var(--dim);font-size:11.5px;font-weight:600}
.phead span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow{display:grid !important;gap:2px 8px;align-items:center;padding:7px 0;
  grid-template-columns:150px 1fr 104px 44px 74px;
  grid-template-areas:"k zh v w d" "n n n n n"}
.prow .nm{grid-area:k;width:auto !important;font-family:var(--mono);font-size:12px}
.prow .zh{grid-area:zh;width:auto !important;max-width:none;border-bottom:1px dotted var(--line)}
.prow input{grid-area:v;width:104px !important}
.prow .pwt{grid-area:w}
.prow .pill{grid-area:d;justify-self:start;white-space:nowrap}
.prow .ds{grid-area:n;color:var(--dim);font-size:12px;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;cursor:pointer;min-width:0}
.prow.open .ds{white-space:normal;overflow:visible}
.prow .nm,.prow .zh{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:620px){
  .phead{grid-template-columns:1fr 96px 44px}
  .phead .h-d{display:none}
  .prow{grid-template-columns:1fr 96px 44px;grid-template-areas:"k zh v" "w d d" "n n n"}
  .prow .pwt{grid-area:w}
}
.zh{color:#c9d1d9;font-size:12.5px;flex:0 0 auto;max-width:200px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;border-bottom:1px dotted var(--line)}
.pcat{margin:10px 0 4px;padding:5px 8px;background:rgba(75,140,247,.08);border-left:3px solid var(--acc);
  border-radius:6px;font-size:13px;font-weight:600}
.chipq{transition:background .12s,border-color .12s,transform .12s,box-shadow .12s}
.chipq:active{transform:scale(.94)}
/* 选中：同色系但对比明显（灰底深一档 + 深色内描边 + 加粗 + ✓ 前缀）；主题里 chipq 有 !important ✗ 故同时覆盖浅色 ✓ */
.chipq.on{background:var(--line);border-color:var(--fg);color:var(--fg);font-weight:700;box-shadow:inset 0 0 0 1px var(--fg)}
.chipq.on::before{content:'✓ ';font-weight:700}
.chipq:hover{border-color:var(--dim)}
html[data-theme="light"] .chipq.on{background:var(--line) !important;border-color:var(--fg) !important;color:var(--fg) !important}
.prow input{width:120px}
/* 数据可用性/上电状态（2026-09-20）：让「没上电」和「坏了」一眼可分 */
.banner{display:flex;gap:10px;align-items:center;padding:8px 12px;font-size:13px;
  background:#3a2a12;border-bottom:1px solid #7a5a20;color:#f0d9a8}
.banner b{white-space:nowrap}
.banner .x{margin-left:auto;opacity:.7;cursor:pointer}
.flag{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border-radius:9px;
  background:#0b0f14;border:1px solid var(--line);font-size:12.5px;color:var(--dim)}
.flag .dot{width:9px;height:9px;border-radius:50%;background:#5c6675}
.flag.on{color:var(--fg)} .flag.on .dot{background:var(--g);box-shadow:0 0 0 3px rgba(63,185,80,.18)}
.flag.off{color:#f0b8b4} .flag.off .dot{background:var(--r);box-shadow:0 0 0 3px rgba(248,81,73,.18)}

}

/* 手机适配 v2（2026-09-21 用户截图反馈）：换行紧凑布局，写按钮不再拉满整行 */
/* 参数行：换行布局（默认生效，不再依赖媒体查询） */

  .phead{display:none}
  .prow{display:flex !important;flex-wrap:wrap;gap:6px 8px;align-items:center;
        padding:8px 0;border-top:1px solid var(--line)}
  .prow .nm{flex:1 1 100%;font-family:var(--mono);font-size:12px;color:var(--fg)}
  .prow .zh{flex:1 1 auto;max-width:58%;font-size:12px;color:var(--dim);
        overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-bottom:none}
  .prow input{flex:0 0 84px !important;width:84px !important}
  .prow .pwt{flex:0 0 auto;padding:4px 12px}
  .prow .pill{flex:0 0 auto}
  .prow .ds{flex:1 1 100%;font-size:11.5px;color:var(--dim);white-space:nowrap;
        overflow:hidden;text-overflow:ellipsis}
  .prow.open .ds{white-space:normal;overflow:visible}
  .pcat{margin:10px 0 2px;padding:6px 8px}

/* 参数行三行式（2026-09-21 用户指定）：1英文+中文 / 2默认·当前·写 / 3说明 */
.prow{display:flex !important;flex-direction:column;gap:5px;padding:9px 0;border-top:1px solid var(--line)}
.phead{display:none !important}
.prow .ln1{display:flex;align-items:baseline;gap:8px;min-width:0}
.prow .ln1 .nm{flex:0 0 auto;font-family:var(--mono);font-size:12.5px;color:var(--fg);white-space:nowrap}
.prow .ln1 .zh{flex:1 1 auto;min-width:0;font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .ln2{display:flex;align-items:center;gap:8px;min-width:0}
.prow .ln2 .pill{flex:0 0 auto}
.prow .ln2 .lb{flex:0 0 auto;font-size:11.5px;color:var(--dim)}
.prow .ln2 input{flex:1 1 auto;min-width:0;width:auto !important;font-size:12.5px;padding:5px 8px}
.prow .ln2 .pwt{flex:0 0 auto;padding:5px 14px}
.prow .ds{font-size:11.5px;color:var(--dim);white-space:normal;line-height:1.45;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.prow.open .ds{-webkit-line-clamp:unset}

/* 左对齐（2026-09-21 用户要求）：参数行及其子元素一律靠左，禁止居中/右偏 */
.prow,.prow *{text-align:left !important}
.prow{align-items:flex-start !important}
.prow .ln1,.prow .ln2{justify-content:flex-start !important;width:100%}
.prow .ln2 input{text-align:left !important}
.prow .ds{direction:ltr !important;unicode-bidi:normal !important;text-indent:0 !important}
.card,.wrap,.pcat,.phead{text-align:left !important}

/* 2026-09-23 修「图例圆点全是黑的」✗：.sw 没设颜色 → 补上主题色 + 主题取不到时用兜底色 ✓ */
.sw{display:inline-block !important;width:9px !important;height:9px !important;border-radius:50% !important;
    margin-right:4px;vertical-align:middle;background:currentColor}
.chip.y .sw,.chip.y>i.sw{background:var(--y,#e8c400) !important}
.chip.g .sw,.chip.g>i.sw{background:var(--g,#3fb950) !important}
.chip.o .sw,.chip.o>i.sw{background:var(--o,#ff9f43) !important}
.chip.y .nm{color:var(--fg) !important} .chip.g .nm{color:var(--fg) !important} .chip.o .nm{color:var(--fg) !important}

/* 2026-09-23 v1.7 #7：顶部页签横向丝滑滑动 ✓ */
nav.tabs{overflow-x:auto !important;overflow-y:hidden !important;flex-wrap:nowrap !important;
  -webkit-overflow-scrolling:touch;scroll-behavior:smooth;scrollbar-width:none;scroll-snap-type:x proximity}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:0 0 auto !important;scroll-snap-align:center}
</style>
<link rel="stylesheet" href="/theme.css?v=0">
<!-- 布局模式：手机/平板 = 1.97 原始布局（菜单在最上面，默认）；车机 = 左栏 html[data-layout="car"] -->
<script>(function(){try{var m=/[?&]layout=(phone|tablet|car)/i.exec(location.search);var L=m?m[1].toLowerCase():(localStorage.getItem("c3layout")||"tablet");if(m)localStorage.setItem("c3layout",L);document.documentElement.setAttribute("data-layout",L);if(/[?&]inapp=1/i.test(location.search))window.__C3APP=true;}catch(e){}})();</script>
<script>/* 2026-10-05 换页过渡 v2（用户反馈「v1 切投屏会白屏一段时间」）：
   v1 是"藏住正文直到 DOMContentLoaded"→ 车机加载慢时，藏多久就白屏多久 ✗
   v2 改成**时间有界**的淡入：这里只加一个 c3-entering（复用既有动画），固定 .22s 就结束，
   跟页面加载多慢完全无关；**绝不藏内容** ✓ */
(function(){try{ if(sessionStorage.getItem('c3nav')==='1'){ sessionStorage.removeItem('c3nav');
  var r=document.documentElement; r.className+=' c3-entering';
  setTimeout(function(){ r.className=r.className.replace(/\s*c3-entering/g,' '); },620);
} }catch(e){}})();</script>
<script>/* 2026-09-22 过渡动画：模式变了 → 落地时淡入/滑入 ✓ */
(function(){try{var r=document.documentElement;var lay=r.getAttribute('data-layout')||'tablet';
var prev=localStorage.getItem('c3layoutSeen')||'';
if(prev&&prev!==lay){r.classList.add('c3-entering');setTimeout(function(){r.classList.remove('c3-entering');},620);}
localStorage.setItem('c3layoutSeen',lay);}catch(e){}})();</script>
</head>
<body>
<header>
  <div class="row1" id="sampBar">
    <b class="brand">C3 诊断台</b>
    <span id="st" class="pill">未连接</span>
    <select id="hostSel" title="采样/诊断的目标主机（换 Wi-Fi 后热点地址常失效，切局域网地址）"></select>
    <button id="testHost" class="gh">测试</button>
    <button id="bs" class="pri">开始采样</button>
    <button id="bx" class="gh">停止</button>
    <label>hz <input id="hz" type="number" value="10" min="2" max="100" style="width:64px"></label>
    <label>时间窗 <select id="win" title="横轴显示最近多少秒；线太密就调大">
      <option value="5">5 秒</option>
      <option value="10">10 秒</option>
      <option value="20" selected>20 秒</option>
      <option value="40">40 秒</option>
      <option value="80">80 秒</option>
    </select></label>
    <label>重放 <select id="routeSel" title="C3 设备上最近的路线分段（自动列出，选中即填入）"><option value="">路线…</option></select>
      <button id="routeRef" class="gh" title="重新拉取路线列表" style="padding:4px 9px">⟳</button></label>
    <label style="display:inline-flex;align-items:center;gap:5px"><input id="fa" type="checkbox" checked style="width:auto;margin:0;vertical-align:middle">快放</label>
    <button id="snap" class="gh">快照 CSV</button>
    <button id="anBtn" class="gh">分析本次采样</button>
    <span class="sp"></span>
  </div>
  <div class="tabs">
    <div class="tab on" data-p="p1">调试图表</div>
    <div class="tab" data-p="p2">横向诊断</div>
    <div class="tab" data-p="p3">参数</div>
    <div class="tab" data-p="p4">设备状态</div>
  </div>
</header>

<div id="banner" class="banner" style="display:none">
  <b id="bannerTitle">—</b><span id="bannerText" style="flex:1"></span>
  <span class="x" id="bannerX" title="收起">✕</span>
</div>

<div class="pane on" id="p1">
<div class="wrap" id="wrap"></div></div>

<div class="pane" id="p2">
  <div id="anBox" style="display:none;margin:6px 0 10px"></div>
  <div class="card" style="margin-bottom:10px"><h4>实时指标 <span>（服务端按 30s 窗口计算，含判据）</span></h4>
    <div class="mrow" id="metrics"></div>
  </div>
  <div class="wrap" id="wrap2"></div>
</div>

<div class="pane" id="p3">
  <div class="card" style="margin-bottom:10px">
    <h4>参数总览</h4>
    <div class="row1">
      <input id="pq" placeholder="过滤：参数名或说明，如 弯道 / Lat / Steer" style="flex:1;min-width:210px">
      <label class="note" style="display:flex;align-items:center;gap:4px"><input type="checkbox" id="pOnlySet" style="width:auto"> 只看已写入</label>
      <label class="note" style="display:flex;align-items:center;gap:4px" title="只显示「当前值 ≠ 默认值」的参数"><input type="checkbox" id="pDiffOnly" style="width:auto"> 与默认值不同</label>
      <label class="note" style="display:flex;align-items:center;gap:4px" title="默认只显示常用可调参数（内部状态 / Cache / Git 之类要点开才看）"><input type="checkbox" id="pUserOnly" checked style="width:auto"> 只看常用</label>
      <button id="pall">刷新全部</button>
      <button id="pcsv" title="导出 CSV / 选择导出目录 / 导入并写入，都在这一个按钮里">CSV 导入/导出…</button>
    </div>
    <div class="row1" id="pcatbar" style="margin-top:8px"><span id="pStat" class="note">—</span></div>
    <div id="plist" style="margin-top:8px"><div class="empty">点「刷新全部」从 C3 设备读取…</div></div>

  <div class="card" style="margin-bottom:10px">

function importAllText(text){
  (function(){
    var rows=String(text||'').split(/\r?\n/).filter(function(x){return x.indexOf(',')>0});
    var pairs=[], n=0;
    rows.forEach(function(L){
      if(/^key,value/i.test(L)) return;
      var i=L.indexOf(','); var k=L.slice(0,i).trim();
      var v=L.slice(i+1).trim().replace(/^"|"$/g,'');
      if(!k||v==='') return; pairs.push(k+'='+v); n++;
    });
    if(!pairs.length){ log('CSV 里没有可用的 key,value'); toast('CSV 里没有可用的 key,value','err'); return; }
    toast('开始导入 '+n+' 项…','warn');                                     // 用户要求：导入也要提示 ✓
    var CH=40, done=0;
    (function batch(){
      var part=pairs.slice(done,done+CH);
      if(!part.length){ log('导入完成，共 '+n+' 项'); setSt('导入完成 '+n+' 项');
        toast('✓ 导入完成，共 '+n+' 项','ok'); readCurated(); return; }
      exec(PY+' set '+part.join(' '),function(r){ done+=part.length;
        log('写入 '+done+'/'+n+' …'); setSt('导入中 '+done+'/'+n);
        toast('导入中 '+done+'/'+n,'warn'); batch(); });
    })();
  })();
}

function statusHtml(raw){

  function val(s,re){ var m=re.exec(s); return m?m[1]:''; }
  var when=(L[0]||'').trim();
  var up=find(/\bup\b/), upTxt='—';
  if(up){ var m=up.match(/up\s+(.+?),\s+(\d+)\s+user/);
    var ld=up.match(/load average:\s*([\d.,\s]+)/);
    upTxt=(m?m[1]:up.trim())+(ld?('（负载 '+ld[1].trim()+'）'):''); }
  var can=find(/canValid=/), veh=find(/vEgo=/), st=find(/steeringAngleDeg=/, st);
  var sd=find(/enabled=/), pd=find(/panda controlsAllowed=/);
  var noCar=/carState 未收到/.test(txt);
  var model=(/model=([^\n]*)/.exec(txt)||[])[1]||'';
  var pm=/proc manager=(\d+) controlsd=(\d+) card=(\d+)/.exec(txt);

  var prob=[];
  if(noCar) prob.push('没收到车辆数据（车没启动 / CAN 未通）');
  if(/canTimeout=True/.test(can)) prob.push('CAN 有超时');
  if(/canErrorCounter=(?!0\b)\d+/.test(can)) prob.push('CAN 有错误计数');
  if(!noCar && pd && /controlsAllowed=False/.test(pd)) prob.push('panda 未放行控制');
  if(pm && (pm[2]==='0'||pm[3]==='0')) prob.push('controlsd/card 进程缺失');

  function row(label,valtxt,lvl){
    var col=(lvl==='ok')?'var(--ok)':(lvl==='warn')?'var(--warn)':(lvl==='err')?'var(--err)':'var(--fg)';
    return '<div style="display:flex;gap:8px;align-items:flex-start;padding:3px 0;border-bottom:1px dashed var(--line)">'
      +'<b style="flex:0 0 78px;color:var(--dim);font-weight:600">'+label+'</b>'

  h+=row('设备时间', esc(when||'—'), '');

  // CAN
  if(can){
    var cv=val(can,/canValid=(\w+)/), ct=val(can,/canTimeout=(\w+)/), ce=val(can,/canErrorCounter=(\d+)/);
    var canOk=(cv==='True'&&ct!=='True'&&ce==='0');
    h+=row('CAN 通信', (canOk?'✅ 正常':'⚠️ 异常')+' · 有效='+esc(cv)+' 超时='+esc(ct)+' 错误计数='+esc(ce), canOk?'ok':'warn');
  } else if(noCar){ h+=row('CAN 通信','⚠️ 没收到车辆数据（车没启动时属正常）','warn'); }
  // 车辆
  if(veh){
    var v=val(veh,/vEgo=([\d.]+)/), kmh=val(veh,/m\/s \((\d+) km\/h\)/), gear=val(veh,/gear=(\S+)/), still=val(veh,/standstill=(\w+)/);
    h+=row('车辆状态', (still==='True'?'⏸ 静止':'▶ 行驶')+' · 车速 '+esc(kmh||v)+' km/h · 挡位 '+esc(gear), '');
  }
  // 转向/踏板
  if(st){
    var ang=val(st,/steeringAngleDeg=([-\d.]+)/), tq=val(st,/steeringTorque=([-\d.]+)/), br=val(st,/brakePressed=(\w+)/), ga=val(st,/gasPressed=(\w+)/);
    h+=row('转向/踏板','转向角 '+esc(ang)+'° · 转向扭矩 '+esc(tq)+' · 刹车'+(br==='True'?'已踩':'未踩')+' · 油门'+(ga==='True'?'已踩':'未踩'), '');
  }
  // 辅助驾驶
  if(sd){
    var en=val(sd,/enabled=(\w+)/), ac=val(sd,/active=(\w+)/);
    var a1=val(sd,/alert1=([^,]*,)/), a2=val(sd,/alert2=([^,]*)/);

      + ((a1&&a1!=='—')?(' · 提示：'+esc(a1)):''), on?'ok':'');
  }

  if(pd){
    var ca=val(pd,/controlsAllowed=(\w+)/), sm=val(pd,/safetyModel=(\S+)/), fl=val(pd,/faults=\[([^\]]*)\]/);
    var ok=(ca==='True');
    if(noCar){ h+=row('控制许可','• 车没启动，暂不判定 · 安全模型 '+esc(sm), ''); }
    else { h+=row('控制许可', (ok?'✅ 允许控制':'⚠️ 不允许控制')+' · 安全模型 '+esc(sm)+(fl?(' · 故障 '+esc(fl)):''), ok?'ok':'warn'); }
  }
  if(model) h+=row('车型模型', esc(model.trim()), '');

/* ======================================================================
   2026-09-22 用户问："转向诊断数据曲线可以分析吧" → 对本次采样做真分析 ✓
   字段语义取自设备侧 live_stream.py（不猜）：
     sat=转向饱和 · lae=期望-实际横向加速度误差 · dce=期望-实际曲率误差
     lat=横向激活(1/0) · lp=车道概率 · v=车速 · en=openpilot使能 · tq=实际扭矩
   ====================================================================== */
function st(arr){
  var a=arr.filter(function(x){ return x!==null && x!==undefined && isFinite(x) });
  if(!a.length) return null;
  a=a.slice().sort(function(x,y){ return x-y });
  function q(pp){ var i=Math.min(a.length-1,Math.max(0,Math.round(pp*(a.length-1)))); return a[i]; }
  var sum=0; a.forEach(function(x){ sum+=x });
  var mean=sum/a.length, sd=0; a.forEach(function(x){ sd+=(x-mean)*(x-mean) }); sd=Math.sqrt(sd/a.length);
  return {n:a.length, mean:mean, sd:sd, min:a[0], p50:q(.5), p95:q(.95), max:a[a.length-1]};
}
function f2(x){ return (Math.abs(x)>=100?x.toFixed(0):x.toFixed(2)); }

  var t0=(S[0]&&S[0].t)||0, t1=(S[S.length-1]&&S[S.length-1].t)||0, dur=Math.max(0,t1-t0);
  var sr=dur>0?(S.length/dur):0;

      .then(function(r){return r.json()}).then(function(j){
        var pre=document.createElement('pre');
        pre.style.cssText='white-space:pre-wrap;font-size:12.5px;background:var(--bg3);border:1px solid var(--line);border-radius:8px;padding:8px;margin-top:6px';

/** 档案相对「当前设备值」的差异（只取有值、且与设备不同的项） */

   且 0.5 与 0.50 应视为相同 ✓（原来纯字符串比较 → "没改动也报差异 1 项" ✗） */
function sameVal(a,b){
  if(a===undefined||a===null) a='';
  if(b===undefined||b===null) b='';
  var x=String(a).trim(), y=String(b).trim();
  if(x===y) return true;
  var re=/^[-+]?[0-9]*\.?[0-9]+$/;
  if(re.test(x)&&re.test(y)){ var nx=parseFloat(x), ny=parseFloat(y); if(isFinite(nx)&&isFinite(ny)) return nx===ny; }
  return false;
}

/* 2026-09-22 用户要求：选 1 个档案 → 与「当前设备参数」对比；选 ≥2 个 → 档案之间对比 ✓ */
function profDiffDevice(slot, el){
  var d=pLoad(slot); if(!d){ el.textContent='档案 '+slot+' 还是空的，先存内容。'; return; }
  var p=d.p||{}, cur=(PALL&&PALL.values)||{};
  var ks={}; Object.keys(p).forEach(function(k){ks[k]=1}); Object.keys(cur).forEach(function(k){ks[k]=1});
  var rows=[], skipN=0;
  Object.keys(ks).sort().forEach(function(k){
    if(profSkip(k)){ skipN++; return; }
    if(sameVal(p[k],cur[k])) return;
    rows.push([k,(p[k]===undefined||p[k]==='')?'—':String(p[k]),(cur[k]===undefined||cur[k]==='')?'—':String(cur[k])]);
  });
  var w=18; rows.forEach(function(r){ if(r[0].length>w) w=Math.min(34,r[0].length); });
  var cw=16, NL=String.fromCharCode(10);
  var out='对比：档案 '+slot+(d.note?('（'+d.note+'）'):'')+'  ×  当前设备参数'+NL+'差异 '+rows.length+' 项';
  out+=(rows.length?'':'（与当前设备完全一致 ✓）')+NL+NL;
  out+=padCJK('参数',w)+' | '+padCJK(slot,cw)+' | '+padCJK('当前设备',cw)+NL;
  out+=new Array(w+2*(cw+3)+3).join('-')+NL;
  rows.forEach(function(r){ out+=padCJK(r[0],w)+' | '+padCJK(r[1],cw)+' | '+padCJK(r[2],cw)+NL; });
  out+=NL+'备注：'+slot+'：'+(d.note||'（无）')+'   存于 '+d.t+NL;
  if(skipN) out+=NL+'（已忽略 '+skipN+' 项「未在设备界面中」的参数：默认不存档、也不写回 ✓）';
  out+=NL+'（当前设备值取自参数总览；点「刷新全部」可更新）';
  el.textContent=out;
}
function profDiff(){
  var el=document.getElementById('ab'); if(!el) return;
  var NL=String.fromCharCode(10);
  var sel=Object.keys(PSEL).filter(function(x){return PSEL[x]});
  if(!sel.length){ el.textContent='先在上面点选档案胶囊（A–H · Z）：'+NL+'· 选 1 个 = 该档案 × 当前设备参数对比'+NL+'· 选 2 个以上 = 档案之间对比'; return; }
  if(sel.length===1){ profDiffDevice(sel[0], el); return; }
  var data=sel.map(function(s){ return {s:s,d:pLoad(s)} }).filter(function(x){return x.d});
  if(data.length<2){ el.textContent='选中的档案里有空档，先存内容再对比。'; return; }
  var ks={}; data.forEach(function(x){ Object.keys(x.d.p||{}).forEach(function(k){ks[k]=1}) });
  var rows=[], skipN=0;
  var MISS='（未记录）';
  Object.keys(ks).sort().forEach(function(k){
    if(profSkip(k)){ skipN++; return; }
    var vs=data.map(function(x){ var v=(x.d.p||{})[k]; return (v===undefined||v===null||v==='')?MISS:String(v).trim(); });
    var same=true;
    for(var i2=1;i2<vs.length;i2++){ if(!sameVal(vs[i2]===MISS?'':vs[i2], vs[0]===MISS?'':vs[0])){ same=false; break; } }
    if(!same) rows.push({k:k, vs:vs});
  });
  var base=data[0].s;
  var out='档案之间对比（共 '+data.length+' 个）'+NL;
  data.forEach(function(x){ out+='  · '+x.s+'　'+(x.d.note||'（无备注）')+'　存于 '+x.d.t+NL; });
  out+=NL+'差异 '+rows.length+' 项'+(rows.length?'（下面只列不同的）':'（所选档案完全一致 ✓）')+NL;
  if(skipN) out+='（已忽略 '+skipN+' 项「未在设备界面中」的参数：默认不存档、也不写回 ✓）'+NL;
  out+=NL;
  rows.forEach(function(r, idx){
    out+=(idx+1)+'. '+r.k+NL;
    for(var j2=0;j2<data.length;j2++){
      var mark='';
      if(j2>0 && !sameVal(r.vs[j2]===MISS?'':r.vs[j2], r.vs[0]===MISS?'':r.vs[0])) mark='   ← 与 '+base+' 不同';
      out+='     '+data[j2].s+'（'+(data[j2].d.note||'无备注')+'）＝ '+r.vs[j2]+mark+NL;
    }
    out+=NL;
  });
  el.textContent=out;
}

<script>
/* 2026-09-24 R111（用户：拖动排序一点都不好用）：
   原来这里**并存了三套**拖动排序实现（先后三次迭代都留在文件里 ✗），三套的 pointer 监听互相打架
   → 一拖就跳、偶发失灵 ✓。现在只保留最后那套「长按悬浮跟随」的实现（下面一节）✓ */
/* 2026-09-23 用户要求：长按卡片 → 悬浮跟手 → 其他卡片实时让位（真正的拖拽 ✓）*/
(function(){
  var ST={card:null, ph:null, zone:null, ox:0, oy:0, w:0, h:0, active:false, timer:0, y0:0, x0:0, id:0};
  function cardsOf(zone){
    var w=document.getElementById(zone);
    if(!w) return [];
    return Array.prototype.filter.call(w.children, function(c){ return c.classList && c.classList.contains('card'); });
  }
  /* 2026-09-24 R112：正文里**不能留把手字符** ✗
     真因：renumber() 用 textContent 重写标题时，会把上一次加进去的把手「≡」也变成正文 ✗，
     然后再加一个新把手 → 越积越多（实测标题里堆了 2~3 个 ≡ ✗）。这里两头都防 ✓ */
  function stripNum(t){ return String(t||'').replace(/^\s*\d+\s*[.、]?\s*/,'').replace(/[≡\s]+$/,''); }
  function titleOf(c){ var h=c.querySelector('h4'); return h?stripNum(h.textContent):''; }
  /* 2026-09-24 R111：给每张卡标题加可见的「≡」把手 ✓
     （原来只写 title 提示 —— 触屏上看不到也摸不到 ✗；renumber 会重写 textContent，所以本函数可重复调用 ✓）*/
  function grip(c){
    var h=c.querySelector('h4'); if(!h) return;
    var olds=h.querySelectorAll('.c3grip');                 /* 2026-09-24 R112：先清干净再放一个 ✓（幂等）*/
    for(var oi=0; oi<olds.length; oi++){ try{ olds[oi].parentNode.removeChild(olds[oi]); }catch(e){} }
    var g=document.createElement('span');
    g.className='c3grip'; g.textContent='≡';
    g.style.cssText='float:right;opacity:.45;font-weight:400;margin-left:8px;letter-spacing:-1px';
    h.appendChild(g);
  }
  function renumber(){
    var all=cardsOf('wrap').concat(cardsOf('wrap2'));
    all.forEach(function(c,i){
      var h=c.querySelector('h4'); if(!h) return;
      var olds=h.querySelectorAll('.c3grip');               /* 先摘把手，否则它会被当成标题正文 ✗ */
      for(var k=0; k<olds.length; k++){ try{ olds[k].parentNode.removeChild(olds[k]); }catch(e){} }
      h.textContent=(i+1)+' '+stripNum(h.textContent);
      grip(c);
    });
    try{
      localStorage.setItem('c3chartOrder', JSON.stringify(all.map(titleOf)));
    }catch(e){}
  }
  function lift(c, ev){
    var r=c.getBoundingClientRect();
    ST.card=c; ST.zone=(c.parentNode && c.parentNode.id) ? c.parentNode.id : 'wrap';
    ST.w=r.width; ST.h=r.height; ST.ox=ev.clientX-r.left; ST.oy=ev.clientY-r.top;
    // 占位块（撑住原位 → 其他卡片围绕它让位 ✓）
    var ph=document.createElement('div');
    ph.style.cssText='height:'+r.height+'px;margin:6px 0;border-radius:10px;'
      +'border:2px dashed var(--acc);background:rgba(31,111,235,.08);box-sizing:border-box';
    c.parentNode.insertBefore(ph, c);
    ST.ph=ph;
    // 卡片变"悬浮"（fixed + 跟手 ✓）
    c.style.position='fixed'; c.style.left='0px'; c.style.top='0px';
    c.style.width=ST.w+'px'; c.style.height=ST.h+'px'; c.style.margin='0';
    c.style.zIndex='9999'; c.style.pointerEvents='none';
    c.style.transition='none'; c.style.opacity='.96';
    c.style.transform='translate('+(r.left)+'px,'+(r.top)+'px) scale(1.03) rotate(0.4deg)';
    c.style.boxShadow='0 18px 40px rgba(0,0,0,.45)';
    c.classList.add('c3-lifted');
    ST.active=true;
    try{ if(navigator.vibrate) navigator.vibrate(15); }catch(e){}
  }
  /* 2026-09-24 R111：拖动到边缘附近自动滚动 ✓（否则长列表根本挪不到远处 ✗）*/
  var AS={el:null, v:0, t:0};
  function scrollBox(){
    if(AS.el) return AS.el;
    var p=ST.card;
    while(p && p!==document.body){
      var oy=''; try{ oy=getComputedStyle(p).overflowY; }catch(e){}
      if((oy==='auto'||oy==='scroll') && p.scrollHeight>p.clientHeight+4){ AS.el=p; return p; }
      p=p.parentNode;
    }
    AS.el=document.scrollingElement||document.documentElement;
    return AS.el;
  }
  function autoScroll(y){
    var el=scrollBox(); if(!el) return;
    var se=(document.scrollingElement||document.documentElement);
    var top=(el===se)?0:el.getBoundingClientRect().top;
    var bot=(el===se)?window.innerHeight:el.getBoundingClientRect().bottom;
    var M=90, v=0;
    if(y<top+M) v=-Math.round((top+M-y)/4);
    else if(y>bot-M) v=Math.round((y-(bot-M))/4);
    v=Math.max(-26, Math.min(26, v));
    if(v===AS.v) return;
    AS.v=v;
    if(AS.t) return;
    (function tick(){
      if(!ST.active || !AS.v){ AS.t=0; return; }
      el.scrollTop += AS.v;
      AS.t=requestAnimationFrame(tick);
    })();
    AS.t=1;
  }
  function move(ev){
    if(!ST.active || !ST.card) return;
    autoScroll(ev.clientY);
    ST.card.style.transform='translate('+(ev.clientX-ST.ox)+'px,'+(ev.clientY-ST.oy)+'px) scale(1.03) rotate(0.4deg)';
    // 找目标位置 → 移动占位块 → 其他卡片实时让位 ✓
    var y=ev.clientY, arr=cardsOf(ST.zone), target=null, below=false;
    for(var i=0;i<arr.length;i++){
      var x=arr[i]; if(x===ST.card) continue;
      var r=x.getBoundingClientRect();
      if(y >= r.top && y <= r.bottom){ target=x; below=(y > (r.top+r.bottom)/2); break; }
    }
    var ph=ST.ph;
    if(target){
      if(below) target.parentNode.insertBefore(ph, target.nextSibling);
      else target.parentNode.insertBefore(ph, target);
    } else if(arr.length){
      var last=arr[arr.length-1];
      if(y > last.getBoundingClientRect().bottom) last.parentNode.appendChild(ph);
      else if(y < arr[0].getBoundingClientRect().top) arr[0].parentNode.insertBefore(ph, arr[0]);
    }
  }
  function drop(ev){
    if(!ST.active || !ST.card) return;
    var c=ST.card, ph=ST.ph;
    c.style.position=''; c.style.left=''; c.style.top=''; c.style.width=''; c.style.height='';
    c.style.margin=''; c.style.zIndex=''; c.style.pointerEvents='';
    c.style.transform=''; c.style.opacity=''; c.style.boxShadow='';
    c.classList.remove('c3-lifted');
    try{ if(ph && ph.parentNode===c.parentNode) c.parentNode.replaceChild(c, ph); else if(ph) ph.parentNode.removeChild(ph); }catch(e){}
    renumber();
    ST.card=null; ST.ph=null; ST.active=false;
  }
  function setup(){
    ['wrap','wrap2'].forEach(function(zone){
      var w=document.getElementById(zone); if(!w) return;
      cardsOf(zone).forEach(function(c){
        if(c.__d3) return; c.__d3=1;
        var h=c.querySelector('h4');
        if(h){ h.style.cursor='grab'; h.title=(h.title?h.title+' · ':'')+'长按卡片可悬浮拖动排序 ✓'; grip(c); }
        c.style.userSelect='none'; c.style.webkitUserSelect='none';
        c.addEventListener('pointerdown', function(ev){
          if(ev.button!==undefined && ev.button!==0) return;
          if(ST.active) return;
          /* 2026-09-24 R111：从按钮/输入框/下拉框上按下时**不启动拖动** ✓（否则点按钮会被当成拖动 ✗）*/
          try{
            var tg=ev.target;
            while(tg && tg!==c){
              var tn=(tg.tagName||'').toLowerCase();
              if(tn==='button'||tn==='input'||tn==='select'||tn==='textarea'||tn==='a'||tn==='label') return;
              tg=tg.parentNode;
            }
          }catch(e){}
          ST.y0=ev.clientY; ST.x0=ev.clientX; ST.id=ev.pointerId;
          var c2=c;
          clearTimeout(ST.timer);
          ST.timer=setTimeout(function(){ lift(c2, ev); }, 260);   // 长按 260ms 悬浮 ✓（轻点不触发 ✓）
        });
        c.addEventListener('pointermove', function(ev){
          if(!ST.active){
            if(Math.abs(ev.clientY-ST.y0) > 6 || Math.abs(ev.clientX-ST.x0) > 6){ clearTimeout(ST.timer); }
            return;
          }
          ev.preventDefault();
          move(ev);
        }, {passive:false});
        function end(ev){ clearTimeout(ST.timer); if(ST.active) { drop(ev); } }
        c.addEventListener('pointerup', end);
        c.addEventListener('pointercancel', end);
      });
    });
    document.addEventListener('pointerup', function(){ if(ST.active) drop(); }, true);
    /* 2026-09-24 R111：**关键修复** —— 拖动时页面不能跟着滚 ✗
       （原来只在 pointermove 上 preventDefault，挡不住 touch 滚动 ✓ → 卡片和页面一起动 = 没法用 ✗）
       touchmove 用非 passive 监听 + preventDefault 才能真正拦住滚动 ✓ */
    document.addEventListener('touchmove', function(ev){
      if(!ST.active) return;
      ev.preventDefault();
      try{ var t=ev.touches && ev.touches[0]; if(t) move({clientX:t.clientX, clientY:t.clientY}); }catch(e){}
    }, {passive:false});
    document.addEventListener('contextmenu', function(e){ if(ST.active) e.preventDefault(); });
    return true;
  }
  function applySaved(){
    var ord=null; try{ ord=JSON.parse(localStorage.getItem('c3chartOrder')||'null'); }catch(e){}
    if(!ord||!ord.length) return;
    /* 2026-09-24 R113：存档键也清洗一遍 ✓
       （R111/R112 那段时期标题正文里混进过把手字符 ≡ ✗，旧存档的键带着它，
         跟现在的干净标题对不上 → 恢复时会静默失败、顺序白存 ✗）*/
    ord=ord.map(function(k){ return stripNum(k); });
    var byKey={}, zs={};
    ['wrap','wrap2'].forEach(function(z){ cardsOf(z).forEach(function(c){ byKey[titleOf(c)]=c; zs[titleOf(c)]=z; }); });
    ord.forEach(function(k){ var c=byKey[k]; if(!c) return; document.getElementById(zs[k]||'wrap').appendChild(c); });
    renumber();
  }
  var n=0, restored=false;
  /* 2026-09-24 R114：applySaved() 原来**只在第一次 boot 调用** ✗
     而第一次 boot（DOMContentLoaded）时曲线卡片可能**还没创建好**（mkCharts 在后面才跑 ✓）
     → 找不到卡片 → 顺序其实**从来没恢复过** ✗（用户拖完看着记住了，重开就变回去 ✗）
     改成：每次 boot 都试（applySaved 幂等 ✓），成功一次就停 ✓；拖动中不打扰 ✓ */
  function boot(){
    n++;
    var ok=setup();
    if(ok && !restored && !ST.active){ try{ restored = applySaved() !== false; }catch(e){} }
    if(!restored && n<=8) setTimeout(boot,1200);
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot); else boot();
})();
</script><script>

(function(){

    w.addEventListener('pointermove', function(ev){
      if(!down) return;

    w.addEventListener('pointerup', function(){ down=false; });
    w.addEventListener('pointercancel', function(){ down=false; });
    w.addEventListener('wheel', function(ev){ if(ev.deltaY) { w.scrollLeft += ev.deltaY; ev.preventDefault(); } }, {passive:false});
    w.addEventListener('click', function(){ setTimeout(centerActive, 60); });
  }
  function boot(){ bindDrag(); centerActive(); }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot); else boot();
  setTimeout(boot, 800); setTimeout(centerActive, 1600);
})();

<script>
/* 2026-10-04：点曲线卡片 → 放大占满其它卡片的位置；再点一次收起（独立脚本，避免作用域问题）*/
(function(){
  function cards(){ var a=[]; ["wrap","wrap2"].forEach(function(id){ var w=document.getElementById(id); if(w) a=a.concat(Array.prototype.slice.call(w.children)); }); return a; }
  function toggle(card){
    var on=card.classList.contains("solo");
    cards().forEach(function(c){ c.classList.remove("solo") });
    if(on){ document.body.classList.remove("c3solo"); } else { card.classList.add("solo"); document.body.classList.add("c3solo"); }
    try{ window.dispatchEvent(new Event("resize")); }catch(e){}
  }
  function wire(){
    cards().forEach(function(c){
      if(c.__c3zoom) return; c.__c3zoom=1;
      c.addEventListener("click",function(ev){
        var t=ev.target;
        while(t && t!==c){
          var cn=String((t.className&&t.className.baseVal!==undefined)?t.className.baseVal:(t.className||""));
          if(cn.indexOf("chip")>=0 || cn.indexOf("c3grip")>=0) return;
          if(/^(INPUT|SELECT|BUTTON|A|TEXTAREA)$/.test(t.tagName||"")) return;
          t=t.parentNode;
        }
        toggle(c);
      },false);
    });

  function boot(){ wire(); setInterval(wire,3000); }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",boot); else boot();
})();

      body:JSON.stringify({level:level,msg:String(msg).slice(0,600),where:where||''})}); }catch(e){}
  }
  window.onerror=function(m,s,l,c,e){ send('error', m+' | '+(e&&e.stack?String(e.stack).slice(0,300):''), (s||'')+':'+l); };
  window.addEventListener('unhandledrejection',function(ev){ send('reject',(ev.reason&&ev.reason.message)||String(ev.reason),''); });
  send('info','page loaded '+(location.pathname+location.hash),'');
})();
</script>
<script>
/* 参数写入前的页面内确认框（2026-09-21）。WebView 里 native confirm 不弹，故自绘。 */
function askConfirm(msg, onOk, onCancel){
  var m=document.getElementById('cfMask');
  if(!m){
    m=document.createElement('div'); m.id='cfMask';
    m.style.cssText='position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.62);display:none;align-items:center;justify-content:center;z-index:99;padding:12px';
    m.innerHTML='<div style="background:var(--card);border:1px solid var(--line);border-radius:14px;max-width:620px;width:min(620px,94vw);overflow:hidden">'
      +'<div id="cfMsg" style="padding:14px 16px;white-space:pre-wrap;font-size:14px;line-height:1.65"></div>'
      +'<div style="display:flex;justify-content:flex-end;padding:10px 14px;border-top:1px solid var(--line)">'
      +'<button id="cfNo" class="ghost" style="margin-right:8px">取消</button><button id="cfYes" class="pri">确定写入</button></div></div>';
    document.body.appendChild(m);
  }
  document.getElementById('cfMsg').textContent=msg;
  m.style.display='flex';
  var yes=document.getElementById('cfYes'), no=document.getElementById('cfNo');
  function done(ok){ m.style.display='none'; yes.onclick=null; no.onclick=null; if(ok&&onOk) onOk(); else if(!ok&&onCancel) onCancel(); }
  yes.onclick=function(){ done(true) }; no.onclick=function(){ done(false) };
}

<script>
/* nestedMenu（2026-09-21 用户要求）：车机上把菜单做成"一级菜单里含二级菜单"。
   一级：控制台 / 转向诊断 / 工具 / 赞赏 / 日志（固定存在，永不消失 → 随时能回去）
   二级：各页自己的页签（控制台：主机/终端/文件/实时/运维/设置；诊断：调试图表/横向诊断/参数/设备日志）
   点一级：当前页→展开/收起；别的页→跳过去（那边默认展开） */
(function(){
  function kind(){ try{ return /\/diag/.test(location.pathname) ? 'diag' : 'console' }catch(e){ return 'console' } }
  function nonce(){ return '?t=' + Date.now() }
  /* 2026-10-05：整页跳转统一走过渡（先淡出到背景色再跳，落地淡入）→ 不再生硬/闪烁 ✓ */
  function go(u){ var _f=function(){ location.href = u + nonce() }; if(window.__c3veilOut) window.__c3veilOut(_f); else _f(); }
  function container(){                                  // 通用：找到"页签容器"
    var c=document.querySelector('nav.tabs'); if(c) return c;
    var t=document.querySelector('[data-p]'); if(t&&t.parentNode) return t.parentNode;
    var b=document.querySelector('[data-tab]'); if(b&&b.parentNode) return b.parentNode;
    var s=document.querySelector('.tabs'); if(s) return s;
    return null;
  }
  function build(){
    var side=container(); if(!side||document.getElementById('nmMenu')) return;
    /* 方案A（2026-09-22）：手机/平板 = 一级菜单在 APP 原生顶栏，网页只保留二级页签 → 不重建菜单 */
    if((document.documentElement.getAttribute('data-layout')||'tablet')!=='car') return;
    var kids=Array.prototype.slice.call(side.children);   // 原页签（保留事件）
    kids=kids.filter(function(c){ var t=String(c.textContent||'').trim();
      if(t==='参数'||t==='参数设置'){ c.style.display='none'; return false; } return true; });   /* R103 ✓ */
    var k=kind();
    /* 2026-09-22 布局：手机/平板 = 顶部两行（第1行一级 / 第2行二级）；车机 = 左栏竖排 */
    var TOP=(document.documentElement.getAttribute('data-layout')||'tablet')!=='car';
    side.innerHTML=''; side.id='nmMenu';
    side.style.cssText = TOP
      ? 'display:flex;flex-direction:column;gap:4px;padding:5px 8px;background:var(--bg2);border-bottom:1px solid var(--line)'
      : 'display:flex;flex-direction:column;padding:6px 5px;overflow-y:auto';
    var nmTop=null, nmSub=null;
    if(TOP){
      nmTop=document.createElement('div'); nmTop.id='nmTopRow';
      nmTop.style.cssText='display:flex;flex-direction:row;flex-wrap:nowrap;align-items:center;gap:4px;overflow-x:auto';
      nmSub=document.createElement('div'); nmSub.id='nmSubRow';
      nmSub.style.cssText='display:flex;flex-direction:row;flex-wrap:wrap;align-items:center;gap:2px';
      /* 参照 1.79 原始布局：一级行放页面最顶（header 之上）；二级行留在原位（header 之下） */
      var _hdr=document.querySelector('header');
      if(_hdr&&_hdr.parentNode){ _hdr.parentNode.insertBefore(nmTop,_hdr); side.appendChild(nmSub); }
      else { side.appendChild(nmTop); side.appendChild(nmSub); }
    }
    /* 2026-09-24 R46（用户要求）：一级菜单要有"选中态" —— 当前模块高亮 ✓，其它未选中的收起 ✓
       真因：以前"是不是选中"只按 kind()（console/diag）判断，而投屏/AI 分析/界面设置/软件设置
       都是**控制台页里的二级页签** → 停在这几个页签时仍然高亮"控制台"，且它的子菜单一直展开 ✗ */
    var REG=[];
    function activeKey(){
      try{
        if(kind()==='diag'){
          var _p3=document.getElementById('p3');
          if(_p3 && (' '+(_p3.className||'')+' ').indexOf(' on ')>=0) return 'params';   /* R103：参数页高亮「参数设置」✓ */
          return 'diag';
        }
        var q=String(location.search||'');
        /* ① 先看"当前激活的 section"（最可靠）：二级页签被搬进左栏后，
           软件设置那个按钮会脱离 DOM → 查 nav.tabs button.on 查不到它 ✗ */
        var secs=document.querySelectorAll('section');
        for(var i=0;i<secs.length;i++){
          var el=secs[i], cn=' '+(el.className||'')+' ';
          if(cn.indexOf(' on ')<0) continue;
          var id=el.id||'';
          if(id==='tab-cast') return 'cast';
          if(id==='tab-aian') return 'ai';
          if(id==='tab-uiset') return 'ui';
          if(id==='tab-settings') return 'settings';
        }
        /* ② 回落：看高亮的二级页签按钮 */
        var b=document.querySelector('nav.tabs button.on');
        var t=b?(b.getAttribute('data-tab')||''):'';
        if(t==='cast') return 'cast';
        if(t==='aian') return 'ai';
        if(t==='uiset') return 'ui';
        if(t==='settings') return 'settings';
        if(t&&t!=='hosts') return 'console';          // 其它二级页签都归控制台 ✓
        if(/[?&]ai=1/i.test(q)) return 'ai';          // 初始深链（页签还没被点之前）
        if(/[?&]ui=1/i.test(q)) return 'ui';
        if(/[?&]tab=cast/i.test(q)) return 'cast';
        if(/[?&]tab=aian/i.test(q)) return 'ai';
        if(/[?&]tab=uiset/i.test(q)) return 'ui';
        if(/[?&]tab=settings/i.test(q)) return 'settings';
        return 'console';
      }catch(e){ return 'console'; }
    }
    function paint(rec, cur){
      var head=rec.head, own=rec.own||[];
      if(rec.top){
        head.style.background=cur?'var(--acc)':'var(--bg3)';
        head.style.color=cur?'#fff':'var(--fg)';
        head.style.borderColor=cur?'var(--acc)':'var(--line)';
        return;
      }
      head.textContent=(own.length?(cur?(rec.open===false?'▸ ':'▾ '):'▸ '):'   ')+rec.label;
      head.style.background=cur?'var(--acc)':'var(--bg3)';
      head.style.color=cur?'#fff':'var(--fg)';
      if(rec.sub) rec.sub.style.display=(cur&&rec.open!==false)?'block':'none';
    }
    function applyState(){
      var a=activeKey();
      for(var i=0;i<REG.length;i++) paint(REG[i], REG[i].key===a);
    }
    function item(label, act, own, cur, key){
      if(TOP){
        var h=document.createElement('div');
        h.textContent=label;
        h.style.cssText='cursor:pointer;padding:4px 11px;margin:0;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap;border:1px solid var(--line)';
        h.onclick=function(){ if(activeKey()===key) return; go(act); };
        nmTop.appendChild(h);
        if(cur&&own&&own.length){ own.forEach(function(c){ nmSub.appendChild(c); }); }
        REG.push({key:key,head:h,own:own||[],label:label,top:true,open:true});
        return;
      }
      var wrap=document.createElement('div'); wrap.style.cssText='display:block;margin:0';
      var head=document.createElement('div');
      head.style.cssText='cursor:pointer;padding:6px 8px;margin:2px 0;border-radius:8px;font-size:12.5px;font-weight:600;border:1px solid var(--line)';
      var sub=document.createElement('div');
      sub.style.cssText='display:none;margin:2px 0 6px 8px;padding-left:6px;border-left:2px solid var(--line)';
      (own||[]).forEach(function(c){ sub.appendChild(c); });
      var rec={key:key,head:head,sub:sub,own:own||[],label:label,top:false,open:true};
      head.onclick=function(){
        if(own&&own.length){
          if(activeKey()===key){ rec.open=(rec.open===false); paint(rec,true); }   // 当前模块：只切换展开/收起 ✓
          else go(act);                                                           // 别的模块：跳过去（那边默认展开 ✓）
        } else go(act);
      };
      wrap.appendChild(head); wrap.appendChild(sub); side.appendChild(wrap);
      REG.push(rec); paint(rec,cur);
    }
    try{ window.__nmApply=applyState; }catch(e){}
    var _setTab=null, _rest=[];
    /* 2026-10-05 修（用户报「投屏怎么又在控制台里面有入口了」）：投屏 / AI 分析 / 界面设置
       都已提升为一级菜单 → 左栏二级里必须藏起来并打 __hideDup 标记（否则功能开关那套会把 display 改回来 ✗）*/
    kids.forEach(function(c){ var tx=String(c.textContent||'').trim();
      if(tx==='软件设置') _setTab=c;
      else if(tx==='界面设置'||tx==='AI 分析'||tx==='投屏'){ c.style.display='none'; c.__hideDup=1; _rest.push(c); }
      else _rest.push(c); });
    item('控制台','c3shell://page?p=console', k==='console'?_rest:null, false, 'console');

    item('投屏','c3shell://page?p=console&cast=1', null, false, 'cast');
    try{
      if(k==='console'){
        var pt=localStorage.getItem('c3pendingTab');
        if(pt==='软件设置'){ localStorage.removeItem('c3pendingTab'); setTimeout(function(){ if(_setTab) _setTab.click(); },700); }
      }
    }catch(e){}
    item('运行曲线','c3shell://page?p=diag',  k==='diag'?kids:null,    false, 'diag');   /* R110：改名 ✓ */
    item('参数设置','c3shell://page?p=diag&pane=params', null, false, 'params');   /* 2026-09-24 R103：参数提升为一级菜单 ✓ */
    /* 2026-09-24 R67：设备查找已移到「设备查找」→「主机」页动作行 ✓ */
    item('AI 分析','c3shell://page?p=console&ai=1', null, false, 'ai');   // 2026-09-22：迁移到主菜单，放设备查找下面 ✓
    (function(){                                  /* 「设置」提升为一级菜单（2026-09-21 用户要求） */
      var head=document.createElement('div');
      head.textContent='软件设置';
      head.style.cssText = TOP
        ? 'cursor:pointer;padding:4px 11px;margin:0;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap;background:var(--bg3);color:var(--fg);border:1px solid var(--line)'
        : 'cursor:pointer;padding:6px 8px;margin:2px 0;border-radius:8px;font-size:12.5px;font-weight:600;background:var(--bg3);color:var(--fg);border:1px solid var(--line)';
      head.onclick=function(){
        if(k==='console' && _setTab){ try{ _setTab.click(); }catch(e){} }
        else { try{ localStorage.setItem('c3pendingTab','软件设置'); }catch(e){} go('c3shell://page?p=console'); }
      };
      (TOP?nmTop:side).appendChild(head);
      REG.push({key:'settings',head:head,sub:null,own:[],label:'软件设置',top:!!TOP,open:true});
      paint(REG[REG.length-1],false);
    })();
    item('赞赏','c3shell://reward', null, false, 'reward');
    item('界面设置','c3shell://page?p=console&ui=1', null, false, 'ui');   // 2026-09-22 用户要求：升为一级菜单，放赞赏下面 ✓
    item('软件日志','c3shell://logs', null, false, 'logs');
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',build); else build();
  setTimeout(build,700);
  /* 选中态刷新：app 用 jsSwitchTab 切页签不会重载页面 → 定时把高亮/收起对齐当前模块 ✓（只改样式，很轻）*/
  setInterval(function(){ try{ if(window.__nmApply) window.__nmApply(); }catch(e){} }, 900);
})();
  /* ── 版本号搬到菜单最后一行（2026-09-21）：确定性识别 + 移动 + 晚渲染重试 ── */
  function isVer(t){ t=String(t||'').trim(); return /^v?\d+(\.\d+)+$/.test(t) || /^版本\s*v?\d/.test(t); }
  function diag(msg){ try{ fetch('/api/log',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({msg:'verScan '+msg})}); }catch(e){} }
  /* 版本号（2026-09-21 最终方案）：
     ① 版本文本在 a11y 树可见、但**不是普通 DOM 文本节点**（日志证明扫不到）→ 搬不动
     ② 改为：按"位置"把侧边栏顶部那个神秘元素**隐藏**（并打印它是什么）
     ③ 自己在菜单最后 append 一行「版本 v__APPVER__」（模板会替换成真实版本号） */
  function placeVer(){
    try{
      var side=document.getElementById('nmMenu')||document.querySelector('nav.tabs')||document.querySelector('.tabs');
      if(!side) { setTimeout(placeVer,1000); return; }
      /* 方案A：手机/平板不显示网页版本号（原生顶栏右侧已有 vX.Y） */
      if((document.documentElement.getAttribute('data-layout')||'tablet')!=='car') return;
      var r=side.getBoundingClientRect();
      var all=document.querySelectorAll('*');
      for(var i=0;i<all.length;i++){
        var n=all[i];
        if(side.contains(n)||n.id==='sideVer') continue;
        if(n.children.length) continue;
        var b=n.getBoundingClientRect();
        if(b.width>0 && b.height>0 && b.left<r.right && b.top>=r.top-4 && b.top<r.top+140){
          n.style.display='none';                       // 隐藏原位置那个
          diag('hidePos '+n.tagName+'.'+(n.className||'')+'|'+String(n.textContent||'').trim().slice(0,20));
        }
      }
      var mine=document.getElementById('sideVer');
      if(!mine){
        mine=document.createElement('div'); mine.id='sideVer';
        mine.style.cssText='display:block;margin:auto 2px 0;padding:6px 2px 0;font-size:11px;color:var(--dim);border-top:1px solid var(--line)';   /* margin-top:auto → 钉到最底部 */
        side.appendChild(mine);
      }
      mine.textContent='版本 v__APPVER__';
    }catch(e){ diag('placeVer 异常 '+e.message); }
  }
  setTimeout(placeVer,400); setTimeout(placeVer,1800);

</script>
<script>
/* busyCache（2026-09-21）：① 慢请求显示「加载中」（异步、界面可切）
   ② 只读接口 60 秒内**读缓存**（设备/日志每次进都拉 148KB ls + 137KB routes + 229KB exec 会卡）
      只读白名单：ls / routes / params/all / jobs / live/status / drive/status
      点「刷新」(dref) 或任何 data-nocache 元素 → 本次绕过缓存 */
(function(){
  var CACHE={}, TTL=60000, NOCACHE=false, READ=['/ls','/routes','/params/all','/jobs','/live/status','/drive/status'];
  var pending=0;
  function paneEl(){ var p=document.getElementById('p4'); if(!p) return null; var e=document.getElementById('_busy');
    if(!e){ e=document.createElement('div'); e.id='_busy';
      e.style.cssText='display:none;margin:0 0 8px;padding:8px 12px;border-radius:10px;font-size:13px;background:var(--bg3);color:var(--acc);border:1px solid var(--line)';
      p.insertBefore(e,p.firstChild); } return e; }
  function busy(on,txt){
    pending+=on?1:-1; if(pending<0)pending=0;
    var e=paneEl(); if(!e) return;
    e.style.display=pending>0?'block':'none';
    e.textContent=txt||'⏳ 加载中…（设备日志类数据较大，通常几秒；期间界面可正常切换）';
  }
  function isRead(u){ u=String(u||''); for(var i=0;i<READ.length;i++) if(u.indexOf(READ[i])>=0) return true; return false; }
  function wrap(name){
    try{
      var f=window[name]; if(typeof f!=='function'||f.__wrapped) return;
      var g=function(){
        var a=Array.prototype.slice.call(arguments);
        var u=(typeof a[0]==='string')?a[0]:JSON.stringify(a[0]||'');
        var cb=null, ci=-1;
        for(var i=a.length-1;i>=0;i--){ if(typeof a[i]==='function'){ cb=a[i]; ci=i; break; } }
        if(isRead(u) && !NOCACHE){
          var k=name+'|'+u, now=Date.now();
          if(CACHE[k] && (now-CACHE[k].t)<TTL){
            if(cb){ try{ return cb(CACHE[k].v); }catch(e){} }
          }
        }
        if(ci>=0){
          a[ci]=function(r){ if(isRead(u)){ CACHE[name+'|'+u]={t:Date.now(),v:r}; } busy(false); if(cb) return cb.apply(null,arguments); };
          busy(true, isRead(u)?'⏳ 首次加载该数据…（已缓存，之后切换很快）':null);
        } else { busy(true); setTimeout(function(){ busy(false); },800); }
        try{ return f.apply(null,a); }catch(e){ busy(false); throw e; }
      };
      g.__wrapped=true; window[name]=g;
    }catch(e){}
  }
  ['exec','api','get','post'].forEach(wrap);
  function hookNocache(){ try{
      document.addEventListener('click',function(ev){
        var t=ev.target; while(t&&t!==document){ if(t.id==='dref'||t.getAttribute&&t.getAttribute('data-nocache')!==null){ NOCACHE=true; setTimeout(function(){NOCACHE=false;},1500); return; } t=t.parentNode; }
      },true);
    }catch(e){} }
  hookNocache();
})();
</script>
